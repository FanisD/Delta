repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint
        entry: uv run --directory backend ruff check app scripts tests
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-format
        name: Ruff format
        entry: uv run --directory backend ruff format --check app scripts tests
        language: system
        types: [python]
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run --directory backend mypy app scripts tests
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run --directory backend pytest
        language: system
        types: [python]
        pass_filenames: false
      - id: frontend-eslint
        name: ESLint
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false
      - id: frontend-prettier
        name: Prettier
        entry: npm --prefix frontend run format:check
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: frontend-vitest
        name: Vitest
        entry: npm --prefix frontend test
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false
