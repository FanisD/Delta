name: Package launcher

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: delta-linux
          - os: macos-latest
            artifact: delta-macos
          - os: windows-latest
            artifact: delta-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project backend --locked
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: uv run --project backend pyinstaller packaging/Delta.spec --noconfirm
      - if: runner.os != 'Windows'
        run: python packaging/smoke.py dist/Delta/Delta
      - if: runner.os == 'Windows'
        run: python packaging/smoke.py dist/Delta/Delta.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/Delta/
      - name: Archive and checksum
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            7z a "${{ matrix.artifact }}.zip" dist/Delta/*
          else
            tar -czf "${{ matrix.artifact }}.tar.gz" -C dist Delta
          fi
          sha256sum ${{ matrix.artifact }}.* > "${{ matrix.artifact }}.sha256" || shasum -a 256 ${{ matrix.artifact }}.* > "${{ matrix.artifact }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-release
          path: |
            ${{ matrix.artifact }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-release"
          merge-multiple: true
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
