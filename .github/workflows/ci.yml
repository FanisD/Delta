name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: uv sync --project backend --locked
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Generate the API types
        run: make gen-api
      - name: Verify generated API types are up to date
        run: |
          git diff --exit-code -- frontend/src/api/
          test -z "$(git ls-files --others --exclude-standard -- frontend/src/api/)"
      - name: Run lint, format, type checks, and tests
        run: make check
